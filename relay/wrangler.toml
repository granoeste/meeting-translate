# 会場の参加者に翻訳を見せる中継(Cloudflare Worker + Durable Object)の設定です。秘密の値は書きません。
# 閲覧キーと送信トークンは wrangler secret で登録します(手元で試すときは relay/.dev.vars)。手順は relay/README.md を見てください。
#   npx wrangler@4.156.2 deploy

name = "meeting-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# viewer.html を文字列として import する
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = false }]

# 会場(チャンネル)の一覧。「ID:表示名」をカンマで区切る。例: "hall-a:Room A,hall-b:Room B"
# ID は英小文字・数字・-(32 文字まで。ws は中継が URL に使うので使えない)。plugins/relay.toml の channel と、閲覧ページの URL(/<閲覧キー>/<ID>/)に使う。
# 表示名は、会場が 2 つ以上あるときに閲覧ページの切り替えに出る(参加者に見える)。
# 1 つ目の会場が、/<閲覧キー>/ を開いたときの既定。会場を変えたら deploy し直す。
# "main" は、チャンネルが無かったころと同じ DO を使う(前の履歴が残る)。plugins/relay.toml の channel の既定も "main"。
# 手元で複数の会場を試すときは、ここを書き換えずに npx wrangler@4.156.2 dev --var "CHANNELS:hall-a:Room A,hall-b:Room B" でも渡せる
[vars]
CHANNELS = "main:Main"
# CHANNELS = "hall-a:Room A,hall-b:Room B"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
